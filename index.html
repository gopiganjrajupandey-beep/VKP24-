<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VKP24 Status Maker</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f4f8;
  text-align: center;
}
header {
  background: #182848;
  color: white;
  padding: 22px;
}
h1 { margin: 0; }
.container {
  background: white;
  margin: 18px auto;
  padding: 18px;
  border-radius: 12px;
  max-width: 450px;
  box-shadow: 0 2px 10px #ccc;
}
input, textarea, button {
  width: 90%;
  padding: 12px;
  margin: 9px 0;
  border-radius: 7px;
  border: 1px solid #bbb;
  box-sizing: border-box;
}
button {
  background: #182848;
  color: white;
  border: none;
  font-size: 16px;
}
canvas {
  width: 90%;
  max-width: 350px;
  margin-top: 12px;
  border: 1px solid #ddd;
}
</style>
</head>
<body>

<header>
<h1>VKP24</h1>
<p>अपना फोटो और स्टेटस खुद बनाएं</p>
</header>

<div class="container">
<h2>अपना स्टेटस बनाएं</h2>

<input type="file" id="photo" accept="image/*">

<textarea id="message" placeholder="अपना संदेश लिखें"></textarea>

<input type="text" id="shop" placeholder="दुकान या व्यापार का नाम">

<button onclick="makeStatus()">स्टेटस बनाएं</button>

<canvas id="canvas" width="600" height="900"></canvas>

<button onclick="downloadStatus()">डाउनलोड करें</button>
<button onclick="shareStatus()">WhatsApp पर शेयर करें</button>
</div>

<script>
let uploadedImage = null;

document.getElementById("photo").onchange = function(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(event) {
    uploadedImage = new Image();
    uploadedImage.onload = makeStatus;
    uploadedImage.src = event.target.result;
  };
  reader.readAsDataURL(file);
};

function makeStatus() {
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#182848";
  ctx.fillRect(0, 0, 600, 900);

  if (uploadedImage) {
    const scale = Math.max(600/uploadedImage.width, 650/uploadedImage.height);
    const w = uploadedImage.width * scale;
    const h = uploadedImage.height * scale;
    ctx.drawImage(uploadedImage, (600-w)/2, 0, w, Math.min(h,650));
  }

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 650, 600, 250);

  ctx.fillStyle = "#182848";
  ctx.textAlign = "center";
  ctx.font = "bold 38px Arial";
  ctx.fillText("VKP24", 300, 710);

  ctx.font = "30px Arial";
  const message = document.getElementById("message").value || "आपका स्वागत है";
  ctx.fillText(message.substring(0, 35), 300, 770);

  ctx.font = "25px Arial";
  ctx.fillText(document.getElementById("shop").value.substring(0,35), 300, 830);
}

function downloadStatus() {
  const link = document.createElement("a");
  link.download = "VKP24-Status.png";
  link.href = document.getElementById("canvas").toDataURL("image/png");
  link.click();
}

async function shareStatus() {
  const canvas = document.getElementById("canvas");
  canvas.toBlob(async function(blob) {
    const file = new File([blob], "VKP24.png", {type:"image/png"});
    if (navigator.canShare && navigator.canShare({files:[file]})) {
      await navigator.share({files:[file], title:"VKP24 Status"});
    } else {
      alert("पहले डाउनलोड करें, फिर WhatsApp पर शेयर करें।");
    }
  });
}
</script>

</body>
</html>
