<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VKP24 Status Maker</title>

<style>
body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #eef2ff;
  text-align: center;
}
.container {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 3px 15px #aaa;
}
h1 {
  color: #172554;
}
input, textarea {
  width: 95%;
  padding: 12px;
  margin: 9px 0;
  border: 1px solid #bbb;
  border-radius: 8px;
  font-size: 16px;
  box-sizing: border-box;
}
button {
  background: #172554;
  color: white;
  border: none;
  padding: 13px 20px;
  margin: 8px;
  border-radius: 8px;
  font-size: 16px;
}
canvas {
  width: 100%;
  max-width: 400px;
  margin-top: 15px;
  border: 1px solid #ddd;
  border-radius: 8px;
}
</style>
</head>

<body>
<div class="container">

<h1>VKP24 Status Maker</h1>
<p>अपनी फोटो से सुंदर स्टेटस बनाएं</p>

<input type="file" id="photo" accept="image/*">

<textarea id="message" rows="2"
placeholder="अपना संदेश लिखें">जय श्री राम</textarea>

<input type="text" id="business"
placeholder="अपना नाम या दुकान का नाम लिखें"
value="VKP24">

<button onclick="makeStatus()">स्टेटस बनाएं</button>

<br>

<canvas id="canvas" width="400" height="500"></canvas>

<br>

<button onclick="downloadStatus()">डाउनलोड करें</button>

</div>

<script>
let selectedImage = null;

document.getElementById("photo").addEventListener("change", function(e) {
  const file = e.target.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(event) {
    const img = new Image();

    img.onload = function() {
      selectedImage = img;
      makeStatus();
    };

    img.src = event.target.result;
  };

  reader.readAsDataURL(file);
});

function makeStatus() {
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#172554";
  ctx.fillRect(0, 0, 400, 500);

  if (selectedImage) {
    const scale = Math.min(
      400 / selectedImage.width,
      330 / selectedImage.height
    );

    const w = selectedImage.width * scale;
    const h = selectedImage.height * scale;

    ctx.drawImage(
      selectedImage,
      (400 - w) / 2,
      20 + (330 - h) / 2,
      w,
      h
    );
  } else {
    ctx.fillStyle = "white";
    ctx.font = "22px Arial";
    ctx.textAlign = "center";
    ctx.fillText("अपनी फोटो लगाएं", 200, 180);
  }

  ctx.fillStyle = "white";
  ctx.textAlign = "center";
  ctx.font = "bold 25px Arial";
  ctx.fillText(
    document.getElementById("message").value,
    200, 400
  );

  ctx.font = "bold 19px Arial";
  ctx.fillText(
    document.getElementById("business").value,
    200, 455
  );
}

function downloadStatus() {
  makeStatus();

  const link = document.createElement("a");
  link.download = "VKP24-Status.png";
  link.href = document.getElementById("canvas").toDataURL("image/png");
  link.click();
}
</script>

</body>
</html>
